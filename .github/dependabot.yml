version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /services/notifications-nestjs
    target-branch: develop
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /services/commerce-laravel
    target-branch: develop
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - "*"
